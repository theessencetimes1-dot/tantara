apiVersion: v1
kind: Namespace
metadata:
  name: tantara
  labels:
    app.kubernetes.io/part-of: tantara
    app.kubernetes.io/managed-by: tantara-deploy-script
---
# Non-secret workspace configuration. Secrets live in the tantara-secrets Secret,
# which deploy/apply.sh builds from the local credentials file; nothing secret is
# committed here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tantara-config
  namespace: tantara
  labels:
    app.kubernetes.io/name: tantara-config
    app.kubernetes.io/part-of: tantara
data:
  DATA_DIR: /data
  # The LAN model host (192.168.0.101, the `smallllm` machine) is offline, so the
  # workspace runs on the Anthropic API exactly as production did — owner's call on
  # 8 Nov ("use the claude api instead of local"). The key itself is not here: it comes
  # from the tantara-secrets Secret, rendered by deploy/render-config.py.
  AI_PROVIDER: anthropic
  CLAUDE_MODEL: claude-haiku-5-5
  ENABLE_CLOUD_PROVIDERS: "true"
  # Only read while AI_PROVIDER is `local`; kept so the revert is one line.
  LOCAL_LLM_BASE_URL: http://192.168.0.101:8080/v1
  LOCAL_LLM_MODEL: MiniCPM5-2B
  EMBEDDING_PROVIDER: fastembed
  FASTEMBED_MODEL: sentence-transformers/all-MiniLM-L6-v2
  EMBEDDING_DIMENSIONS: "384"
  # Postgres vectors + tsvector search; FAISS remains the SQLite-only fallback.
  VECTOR_BACKEND: auto
  OBJECT_STORAGE: s3
  S3_ENDPOINT: http://192.168.0.100:9000
  S3_BUCKET: tantara
  ANALYTICS_BACKEND: "none"
  MAX_UPLOAD_MB: "25"
  CORS_ORIGINS: https://tantra.theessencetimes.com,http://tantra.local:8082
  TANTARA_WORKSPACE_TIME_ZONE: Asia/Kolkata
  # The PostgreSQL instance on 192.168.0.100 is shared and has a fixed connection
  # budget, so the single backend process stays small and recycles connections
  # often: after a node dies its sessions linger until TCP keepalive reaps them,
  # and a wide pool then starves the next start-up (init_db runs Alembic).
  DB_POOL_SIZE: "3"
  DB_POOL_MAX_OVERFLOW: "4"
  DB_POOL_RECYCLE: "600"
